[package]
name = "webfortune-worker"
version = "1.3.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fontdue = "0.9"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"

[profile.release]
lto = true
codegen-units = 1
