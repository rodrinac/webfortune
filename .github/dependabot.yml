version: 2
updates:
  - package-ecosystem: cargo
    directory: /worker
    schedule:
      interval: weekly
    versioning-strategy: auto
    groups:
      worker-cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
