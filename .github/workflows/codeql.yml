name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    env:
      # Skip only the push that lands the bump commit; bump PRs still get CodeQL.
      SKIP_VALIDATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip version-bump]') }}

    steps:
      - name: Accept version bump
        if: env.SKIP_VALIDATION == 'true'
        run: echo "Version-only change; CodeQL completed on the source PR."

      - name: Checkout repository
        if: env.SKIP_VALIDATION != 'true'
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: actions, rust
          build-mode: none

      - name: Analyze code
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/analyze@v4
