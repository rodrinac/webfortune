name: CodeQL

# Full analysis on main and weekly schedule. PRs no longer wait on CodeQL;
# merges still get coverage once they land on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Job permissions replace the workflow default. security-events: write is
    # only needed here, for the CodeQL upload.
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      # Skip only the push that lands the bump commit; analysis ran on earlier main pushes.
      SKIP_VALIDATION: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): v') }}"

    steps:
      - name: Accept version bump
        if: env.SKIP_VALIDATION == 'true'
        run: echo "Version-only change; CodeQL completed on earlier main commits."

      - name: Checkout repository
        if: env.SKIP_VALIDATION != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: actions, rust
          build-mode: none

      - name: Analyze code
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/analyze@v4
