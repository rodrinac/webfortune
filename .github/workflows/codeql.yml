name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]')) &&
        (github.event_name != 'pull_request' || github.head_ref != 'chore/version-bump')
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions, rust
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v4
