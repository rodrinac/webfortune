name: CodeQL

# Full analysis on main and weekly schedule. PRs no longer wait on CodeQL;
# merges still get coverage once they land on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    env:
      # Skip only the push that lands the bump commit; analysis ran on earlier main pushes.
      SKIP_VALIDATION: "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[skip version-bump]') || startsWith(github.event.head_commit.message, 'chore(release): v0.') || startsWith(github.event.head_commit.message, 'chore(release): v1.') || startsWith(github.event.head_commit.message, 'chore(release): v2.') || startsWith(github.event.head_commit.message, 'chore(release): v3.') || startsWith(github.event.head_commit.message, 'chore(release): v4.') || startsWith(github.event.head_commit.message, 'chore(release): v5.') || startsWith(github.event.head_commit.message, 'chore(release): v6.') || startsWith(github.event.head_commit.message, 'chore(release): v7.') || startsWith(github.event.head_commit.message, 'chore(release): v8.') || startsWith(github.event.head_commit.message, 'chore(release): v9.')) }}"

    steps:
      - name: Accept version bump
        if: env.SKIP_VALIDATION == 'true'
        run: echo "Version-only change; CodeQL completed on earlier main commits."

      - name: Checkout repository
        if: env.SKIP_VALIDATION != 'true'
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: actions, rust
          build-mode: none

      - name: Analyze code
        if: env.SKIP_VALIDATION != 'true'
        uses: github/codeql-action/analyze@v4
