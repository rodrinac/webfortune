name: Version bump

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # Skip the release commit itself. Its subject is "chore(release): vX.Y.Z".
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check for an existing open version-bump PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head chore/version-bump --state open --json number --jq '.[0].number // empty')"
          echo "number=${existing}" >> "$GITHUB_OUTPUT"

      - name: Run version bump script
        id: bump
        if: steps.existing-pr.outputs.number == ''
        run: |
          set -euo pipefail
          next_version="$(node scripts/version-bump.mjs)"
          if [ -z "${next_version}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$next_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver bump version: ${next_version}" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Open version bump pull request
        if: steps.existing-pr.outputs.number == '' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "Rodrigo Inácio"
          git config user.email "rodrigo.si.inacio@gmail.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          branch="chore/version-bump"
          git checkout -b "$branch"
          git add package.json package-lock.json worker/Cargo.toml worker/Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git push origin "$branch" --force

          pr_url="$(gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --body "Automated version bump to \`v${VERSION}\`, determined from Conventional Commits merged since the last release tag. Merging this PR creates tag \`v${VERSION}\`, which publishes GitHub Pages after the API smoke test.")"
          PR_NUMBER="${pr_url##*/}"

          # Refuse to admin-merge if the PR head touches anything beyond version metadata.
          changed="$(gh pr diff "$PR_NUMBER" --name-only | sort -u)"
          allowed="$(printf '%s\n' package.json package-lock.json worker/Cargo.lock worker/Cargo.toml | sort -u)"
          if [[ "$changed" != "$allowed" ]]; then
            echo "Version-bump PR touches unexpected paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "${GITHUB_REPOSITORY}" \
            --rebase \
            --admin \
            --delete-branch
