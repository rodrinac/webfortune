name: Deploy production (manual)

# Separate from deploy.yml so workflow_dispatch (default-branch cache write)
# never shares a workflow with checkout of a workflow_run-derived SHA.
on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  worker:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    env:
      API_URL: https://api.webfortune.app
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci --no-audit --no-fund
            npm test
            npm run generate:assets
            (cd worker && cargo test --locked)
            npm run worker:deploy
          '
      - name: Smoke-test deployed Worker
        id: api
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then break; fi
            sleep 10
          done
          curl -fsS "$API_URL/health"
          nix develop --command bash -euo pipefail -c 'CORS_ORIGIN=https://webfortune.app npm run smoke'
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
