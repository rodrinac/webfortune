name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Pushes use the commit SHA so a version-bump merge on main cannot cancel
  # the CI already running for the previous commit. Pull requests stay grouped
  # by number and still cancel superseded runs.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # Skip the push that lands the bump commit itself; pull requests still run CI.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    outputs:
      web: ${{ steps.out.outputs.web }}
      worker: ${{ steps.out.outputs.worker }}
      deploy_command: ${{ steps.out.outputs.deploy_command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require SHA-pinned GitHub Actions
        run: node scripts/check-pinned-actions.mjs
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - 'web/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'playwright.config.*'
              - 'scripts/check-config.mjs'
              - 'scripts/check-pinned-actions.mjs'
              - '.github/workflows/**'
            worker:
              - 'worker/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            deploy_command:
              - 'worker/**'
              - 'scripts/worker-deploy.mjs'
              - 'scripts/fortune-data.mjs'
              - 'scripts/debian-fortune-packages.json'
              - 'scripts/generate-worker-assets.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      - name: Set outputs
        id: out
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "web=true"
              echo "worker=true"
              echo "deploy_command=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "web=${{ steps.filter.outputs.web }}"
              echo "worker=${{ steps.filter.outputs.worker }}"
              echo "deploy_command=${{ steps.filter.outputs.deploy_command }}"
            } >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no web changes)
        if: needs.changes.outputs.web != 'true'
        run: echo "No web-related changes; skipping."

      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - if: needs.changes.outputs.web == 'true'
        run: npm ci --no-audit --no-fund

      - if: needs.changes.outputs.web == 'true'
        run: npm test

      - if: needs.changes.outputs.web == 'true'
        run: npm run build
        env:
          VITE_API_URL: https://api.webfortune.app

      - if: needs.changes.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - if: needs.changes.outputs.web == 'true'
        run: npx playwright install --with-deps chromium

      - if: needs.changes.outputs.web == 'true'
        run: npm run test:e2e

  worker:
    needs: changes
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Skip (no worker changes)
        if: needs.changes.outputs.worker != 'true'
        run: echo "No worker-related changes; skipping."

      - if: needs.changes.outputs.worker == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.worker == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - if: needs.changes.outputs.worker == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - if: needs.changes.outputs.worker == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            worker/target
            ~/.cargo/registry
            ~/.cargo/git
          key: worker-cargo-${{ runner.os }}-${{ hashFiles('worker/Cargo.lock') }}
          restore-keys: |
            worker-cargo-${{ runner.os }}-

      - name: Check Worker
        if: needs.changes.outputs.worker == 'true'
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci --no-audit --no-fund
            cd worker
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
            cargo test --locked
            cd ..
            npm run worker:deploy -- --dry-run --outdir ../build/worker-dry-run
          '

      - name: Smoke-test the Worker locally
        if: needs.changes.outputs.worker == 'true'
        env:
          WEBFORTUNE_SKIP_WORKER_BUILD: "1"
        run: |
          nix develop --command bash -euo pipefail -c '
            npm run worker:dev -- --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
            trap "cat wrangler-dev.log; kill %1" EXIT
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8787/health; then break; fi
              sleep 2
            done
            API_URL=http://127.0.0.1:8787 CORS_ORIGIN=https://webfortune.app npm run smoke
          '

  # Workers Builds has no Nix. This job runs the deploy command the same way
  # that image will: Node on Ubuntu, fortune packages downloaded, Rust installed
  # by the script. `--dry-run` stops before uploading.
  worker-deploy-command:
    needs: changes
    if: needs.changes.outputs.deploy_command == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: worker-build-0.8.7-${{ runner.os }}
          restore-keys: |
            worker-build-0.8.7-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run worker:deploy -- --dry-run --outdir ../build/worker-dry-run
