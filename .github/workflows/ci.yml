name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    # Skip the push that lands the bump commit itself; pull requests still run CI.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.webfortune.app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  worker:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]') }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check Worker
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci --no-audit --no-fund
            npm run generate:assets
            cd worker
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
            cargo test --locked
            npx wrangler deploy --dry-run --outdir ../build/worker-dry-run
          '
      - name: Smoke-test the Worker locally
        run: |
          nix develop --command bash -euo pipefail -c '
            npm run worker:dev -- --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
            trap "cat wrangler-dev.log; kill %1" EXIT
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8787/health; then break; fi
              sleep 2
            done
            API_URL=http://127.0.0.1:8787 CORS_ORIGIN=https://webfortune.app npm run smoke
          '
