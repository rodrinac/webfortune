name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

# No workflow-wide token. The release job opts into contents: write.
permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    # gh release create uses GITHUB_TOKEN. The tag itself is created with
    # VERSION_BUMP_TOKEN via the API, so the checkout does not keep credentials.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver package.json version: ${version}" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether the release tag already exists
        id: existing-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub ignores workflow runs for git events created by GITHUB_TOKEN.
      # A tag created with that token would not start Deploy production.
      # VERSION_BUMP_TOKEN is a normal user token, so this tag push does.
      - name: Create release tag
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "VERSION_BUMP_TOKEN is required to create ${TAG} and start the deploy." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}"

      - name: Create GitHub release
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$SHA"
