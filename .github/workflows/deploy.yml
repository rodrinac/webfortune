name: Deploy production

# A new vX.Y.Z tag is the release. Release creates that tag with
# VERSION_BUMP_TOKEN; a tag created by GITHUB_TOKEN does not start workflows.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_URL: https://api.webfortune.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify this tag is the release commit on main
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Smoke-test the API
        run: |
          set -euo pipefail
          # Workers Builds deploys the release Worker on its own. The Worker it
          # replaces also answers /health with {"status":"ok"}, so wait until
          # this release's version is live before smoke tests.
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(node -e '
            const fs = require("node:fs");
            const match = fs.readFileSync("worker/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m);
            if (!match) {
              console.error("worker/Cargo.toml has no package version");
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ')"
          if [[ "${crate_version}" != "${version}" ]]; then
            echo "worker/Cargo.toml version ${crate_version} does not match release ${version}." >&2
            echo "GET /health reports that crate version. The version bump writes the same value to package.json and worker/Cargo.toml." >&2
            exit 1
          fi
          EXPECTED_VERSION="${version}" node scripts/wait-for-release.mjs
          CORS_ORIGIN=https://webfortune.app node scripts/smoke-api.mjs

  build-pages:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: https://api.webfortune.app
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
