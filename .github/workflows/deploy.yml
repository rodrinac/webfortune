name: Deploy production

# workflow_run only: this workflow must not also accept workflow_dispatch.
# A write-capable trigger plus checkout of a workflow_run-derived SHA is
# flagged by CodeQL as default-branch cache poisoning. Manual deploys live in
# deploy-manual.yml and only check out github.sha.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  release-gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify published release belongs to this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test -n "$version"
          tag="v${version}"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [[ "$tag_sha" == "$RELEASE_SHA" ]]; then
            published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.published_at')"
            if [[ "$published_at" != 'null' ]]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Release ${tag} is not published for ${RELEASE_SHA}; skipping deployment"
          echo "deploy=false" >> "$GITHUB_OUTPUT"

  smoke:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_URL: https://api.webfortune.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Smoke-test the API
        run: |
          set -euo pipefail
          # Workers Builds deploys the Worker. Pages waits until the live API answers.
          for attempt in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then break; fi
            sleep 10
          done
          curl -fsS "$API_URL/health"
          CORS_ORIGIN=https://webfortune.app node scripts/smoke-api.mjs

  build-pages:
    needs: [release-gate, smoke]
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Same verified pin as the smoke job so Pages cannot ship a newer main tip.
          ref: ${{ needs.release-gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: https://api.webfortune.app
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
