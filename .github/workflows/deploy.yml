name: Deploy production

# A new vX.Y.Z tag is the release. Release creates that tag with
# VERSION_BUMP_TOKEN; a tag created by GITHUB_TOKEN does not start workflows.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  build-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify this tag is the release commit on main
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          crate_version="$(node -e '
            const fs = require("node:fs");
            const match = fs.readFileSync("worker/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m);
            if (!match) {
              console.error("worker/Cargo.toml has no package version");
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ')"
          if [[ "${crate_version}" != "${version}" ]]; then
            echo "worker/Cargo.toml version ${crate_version} does not match release ${version}." >&2
            echo "The version bump writes the same value to package.json and worker/Cargo.toml." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: https://api.webfortune.app
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
