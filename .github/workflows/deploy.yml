name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.manual.outputs.deploy || steps.release.outputs.deploy }}
    steps:
      - name: Allow manual deployment
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify published release belongs to this commit
        if: github.event_name == 'workflow_run'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test -n "$version"
          tag="v${version}"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [[ "$tag_sha" == "$RELEASE_SHA" ]]; then
            published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.published_at')"
            if [[ "$published_at" != 'null' ]]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Release ${tag} is not published for ${RELEASE_SHA}; skipping deployment"
          echo "deploy=false" >> "$GITHUB_OUTPUT"

  worker:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    env:
      API_URL: https://api.webfortune.app
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Check and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci --no-audit --no-fund
            npm test
            npm run generate:assets
            (cd worker && cargo test --locked)
            npm run worker:deploy
          '
      - name: Smoke-test deployed Worker
        id: api
        run: |
          set -euo pipefail
          # The first deploy also provisions the custom domain certificate.
          for attempt in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then break; fi
            sleep 10
          done
          curl -fsS "$API_URL/health"
          nix develop --command bash -euo pipefail -c 'CORS_ORIGIN=https://webfortune.app npm run smoke'
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
