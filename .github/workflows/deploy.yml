name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.manual.outputs.deploy || steps.release.outputs.deploy }}
    steps:
      - name: Allow manual deployment
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify published release belongs to this commit
        if: github.event_name == 'workflow_run'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          tag="v${version}"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [[ "$tag_sha" == "$RELEASE_SHA" ]]; then
            published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.published_at')"
            if [[ "$published_at" != 'null' ]]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Release ${tag} is not published for ${RELEASE_SHA}; skipping deployment"
          echo "deploy=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_api_id: ${{ vars.API_ID }}
      TF_VAR_runtime_role_arn: ${{ vars.RUNTIME_ROLE_ARN }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check backend
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Check frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Check whether commit image exists
        id: existing
        run: |
          digest=$(aws ecr describe-images --repository-name webfortune --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish Lambda image
        if: steps.existing.outputs.digest == ''
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      - name: Deploy API
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          export TF_VAR_image_uri="$ECR_REPOSITORY_URL@$IMAGE_DIGEST"
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=webfortune/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=webfortune/prod/workspaces" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform -chdir=infra validate
          terraform -chdir=infra plan -input=false -out=deploy.tfplan
          terraform -chdir=infra apply -input=false deploy.tfplan
      - name: Smoke-test deployed API
        id: api
        run: |
          set -euo pipefail
          export API_URL="$(terraform -chdir=infra output -raw api_url)"
          export CORS_ORIGIN=https://webfortune.app
          npm run smoke
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.backend.outputs.api_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
